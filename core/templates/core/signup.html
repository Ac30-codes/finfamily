{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFamily — Sign up</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Create your household 🏠</h1>
    <p class="topbar">Already have an account? <a href="/accounts/login/">Log in</a></p>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create household & sign up</button>
        </form>
    </div>
</body>
</html>
