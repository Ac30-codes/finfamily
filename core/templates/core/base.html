{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinFamily — {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="shell">
    <nav class="nav">
        <div class="brand">Fin<b>Family</b></div>
        <a href="/" class="{% block nav_home %}{% endblock %}">Overview</a>
        <a href="/recurring/" class="{% block nav_recurring %}{% endblock %}">Recurring</a>
        <div class="spacer"></div>
        <div class="who">Signed in as<b>{{ request.user.username }}</b></div>
        <a href="/logout/">Log out</a>
    </nav>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
